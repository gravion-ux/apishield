[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apishield"
version = "1.0.0"
description = "APIShield — a zero-dependency API security gateway: BOLA/IDOR heuristics, JWT checks, auth-abuse detection, sensitive-data exposure scanning and security-header auditing in front of any HTTP API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Kumar Thakur" }]
keywords = ["api-security", "gateway", "bola", "idor", "jwt", "waf", "appsec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]

[project.scripts]
apishield = "apishield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
